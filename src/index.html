<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Browse UI Elements · Local Library</title><link rel="stylesheet" href="/style.css"><style>.editor{border:1px solid #303030;border-radius:9px;padding:14px;margin:18px 0}.editor>div{display:flex;gap:10px}.editor label{display:block;color:#888;font-size:11px;flex:1}.editor input{display:block;width:100%;margin-top:5px;background:#202020;border:1px solid #444;color:#eee;border-radius:5px;padding:8px}.editor button{margin-top:10px;border:1px solid #555;background:#292929;color:#eee;border-radius:6px;padding:7px 11px;cursor:pointer}</style></head>
<body><header class="topbar"><div class="brand"><span class="mark">✦</span><span>UI Library</span><small>LOCAL ELEMENTS</small></div><span class="topbar-spacer"></span><label class="gpu-toggle" title="启用 GPU 合成优化"><input id="gpu-toggle" type="checkbox"><span class="gpu-switch" aria-hidden="true"><span></span></span><span>硬件加速</span></label><button id="scan">扫描 UI 库</button></header><aside class="category-rail"><p class="rail-title">CATEGORIES</p><nav id="categories"></nav></aside>
<main><section class="browse-head"><p class="eyebrow">LOCAL COLLECTION</p><h1>Browse all</h1><p class="intro">本地收集的开源 UI 元素，支持实时预览、源码复制和组件下载。</p><div id="quick-tags" class="quick-tags"></div></section>
<section class="toolbar"><label class="search">⌕ <input id="search" placeholder="搜索 tags、组件、来源..." /></label><select id="tag"><option value="All">所有标签</option></select><select id="sort"><option value="random">随机排序</option><option value="name">名称排序</option><option value="category">分类排序</option></select><span id="status"></span><span class="total"><b id="count">0</b> elements</span></section>
<section id="grid" class="grid"></section><div class="pagination"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div></main>
<dialog id="detail"><button class="close" id="close">×</button><div class="detail-preview"><iframe id="frame" sandbox="allow-scripts allow-same-origin"></iframe></div><div class="detail-info"><p class="eyebrow" id="detail-category"></p><h2 id="detail-name"></h2><p id="detail-meta"></p><div class="actions"><button id="copy">复制源码</button><button class="primary" id="download">下载组件</button></div><section class="editor"><div><label>名称<input id="edit-name"></label><label>分类<input id="edit-category"></label></div><label>标签（逗号分隔）<input id="edit-tags"></label><button id="save-edit">保存元数据</button></section><div class="code-head"><span>SOURCE FILES</span><select id="file-select"></select></div><pre><code id="code"></code></pre></div></dialog><script src="/app.js" type="module"></script></body></html>
